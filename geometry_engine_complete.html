<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geometry Engine + Advanced Shop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #ededf0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }
    .top-bar {
      width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }
    .hud-group { display: flex; gap: 8px; align-items: center; }
    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      background: #111115;
      border: 1px solid #27272a;
      padding: 6px 11px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .keys-badge { color: #ffea00; }
    .mode-badge { color: #00f0ff; }
    .deaths-badge { color: #ef4444; }
    .shop-btn {
      background: #141418;
      color: #00f0ff;
      border: 1px solid #2e2e38;
      padding: 6px 13px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.15s;
    }
    .shop-btn:hover { background: #1e1e24; border-color: #00f0ff; }
    .wrap { position: relative; }
    canvas { border: 1px solid #27272a; display: block; transition: border-color 0.3s; }
    .hint {
      margin-top: 10px;
      font-size: 0.74rem;
      color: #71717a;
      letter-spacing: 0.6px;
      text-align: center;
    }
    /* Shop Overlay */
    .shop-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 7, 0.95);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 10;
      overflow-y: auto;
    }
    .shop-modal.open { display: flex; }
    .shop-title { font-size: 1.05rem; font-weight: 800; letter-spacing: 3px; color: #fff; }
    .shop-sub { font-size: 0.75rem; color: #71717a; margin-bottom: 12px; }
    .shop-section-label {
      width: 100%;
      max-width: 520px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #a1a1aa;
      margin: 6px 0;
      text-transform: uppercase;
    }
    .skin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 12px;
    }
    .skin-card {
      background: #111115;
      border: 1px solid #27272a;
      border-radius: 7px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: 0.15s;
    }
    .skin-card:hover { border-color: #52525b; background: #18181e; }
    .skin-card.equipped { border-color: #00f0ff; }
    .skin-info { text-align: left; }
    .skin-name { font-size: 0.78rem; font-weight: 700; color: #fff; }
    .skin-cost { font-size: 0.68rem; font-weight: 600; color: #ffea00; margin-top: 2px; }
    .skin-cost.owned { color: #00f0ff; }
    .trail-swatch { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #3f3f46; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="hud-group">
      <div class="badge keys-badge" id="keyHud">KEYS: 0</div>
      <div class="badge mode-badge" id="formHud">FORM: CUBE</div>
      <div class="badge deaths-badge" id="deathHud">ATTEMPTS: 1</div>
    </div>
    <div class="hud-group">
      <button class="shop-btn" id="muteToggle">SFX: ON</button>
      <button class="shop-btn" id="shopToggle">ARMORY [S]</button>
    </div>
  </div>

  <div class="wrap">
    <canvas id="c" width="680" height="380"></canvas>
    <div class="shop-modal" id="shopModal">
      <div class="shop-title">ICON & TRAIL ARMORY</div>
      <div class="shop-sub">Earn +5 Keys per level & +2 Keys for secret coins</div>
      <div class="shop-section-label">Character Skins</div>
      <div class="skin-grid" id="skinGrid"></div>
      <div class="shop-section-label">Dash & Motion Trails</div>
      <div class="skin-grid" id="trailGrid"></div>
      <button class="shop-btn" id="closeShop">RESUME [S]</button>
    </div>
  </div>

  <div class="hint">
    MOVE: A/D or ARROWS &nbsp;•&nbsp; JUMP / THRUST / FLIP: W / UP / SPACE &nbsp;•&nbsp; AIR DASH: SHIFT / K &nbsp;•&nbsp; CHECKPOINT RESET: R &nbsp;•&nbsp; ARMORY: S
  </div>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');

    // --- 8-BIT CHIPTUNE SYNTHESIZER ---
    let audioCtx = null;
    let sfxEnabled = true;
    function playTone(freq, type, duration, slideTo = null, vol = 0.08) {
      if (!sfxEnabled) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    document.getElementById('muteToggle').onclick = (e) => {
      sfxEnabled = !sfxEnabled;
      e.target.textContent = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
    };

    // --- PERSISTENT SAVE DATA ---
    let totalKeys = Number(localStorage.getItem('tb_plat_keys') || 0);
    let unlockedSkins = JSON.parse(localStorage.getItem('tb_plat_skins') || '["blank"]');
    let equippedSkin = localStorage.getItem('tb_plat_equipped') || 'blank';
    let unlockedTrails = JSON.parse(localStorage.getItem('tb_plat_trails') || '["cyan"]');
    let equippedTrail = localStorage.getItem('tb_plat_trail_eq') || 'cyan';

    const SKINS = [
      { id: 'blank', name: 'Blank Cube', cost: 0 },
      { id: 'gdface', name: 'GD Classic', cost: 10 },
      { id: 'ninja', name: 'Neon Ninja', cost: 20 },
      { id: 'visor', name: 'Cyber Visor', cost: 30 },
      { id: 'demon', name: 'Demon Core', cost: 45 },
      { id: 'reactor', name: 'Pulse Grid', cost: 60 }
    ];

    const TRAILS = [
      { id: 'cyan', name: 'Cyber Cyan', color: '#00f0ff', cost: 0 },
      { id: 'pink', name: 'Hyper Pink', color: '#ff007f', cost: 15 },
      { id: 'gold', name: 'Solar Gold', color: '#ffea00', cost: 25 },
      { id: 'emerald', name: 'Toxic Green', color: '#00ff66', cost: 35 },
      { id: 'rainbow', name: 'Prismatic', color: 'rainbow', cost: 50 }
    ];

    function saveShopData() {
      localStorage.setItem('tb_plat_keys', totalKeys);
      localStorage.setItem('tb_plat_skins', JSON.stringify(unlockedSkins));
      localStorage.setItem('tb_plat_equipped', equippedSkin);
      localStorage.setItem('tb_plat_trails', JSON.stringify(unlockedTrails));
      localStorage.setItem('tb_plat_trail_eq', equippedTrail);
    }

    // --- GAME STATE & PHYSICS VARIABLES ---
    const keys = {};
    let jumpPressed = false;
    let jumpHeld = false;
    let dashPressed = false;
    let shopOpen = false;
    let level = 1;
    let attempts = 1;
    let tick = 0;
    let shakeTimer = 0;
    let bannerTimer = 110;

    let platforms = [], crumblePlats = [], spikes = [], pads = [], orbs = [], portals = [], lasers = [], checkpoints = [], coins = [], particles = [], ghostTrail = [], bgProps = [];
    let spawn = { x: 30, y: 280 };
    let activeCheckpoint = null;
    let goal = { x: 540, y: 80, w: 22, h: 36 };
    let bounds = { minX: 0, maxX: 1360, minY: 0, maxY: 380 };
    let cam = { x: 0, y: 0 };
    let theme = { bg: '#0c0c0e', plat: '#27272a', accent: '#00f0ff', spike: '#ef4444', mode: 'CUBE GAUNTLET' };

    const p = {
      x: 30, y: 280, w: 22, h: 22,
      vx: 0, vy: 0,
      form: 'cube',      // 'cube' | 'ship' | 'ball' | 'wave'
      gravDir: 1,        // 1 = normal, -1 = inverted
      onGround: false,
      coyote: 0,
      jumpBuffer: 0,
      dashCharges: 1,
      dashTimer: 0,
      rot: 0,
      facing: 1
    };

    // --- SHOP UI & RENDERING ---
    const shopModal = document.getElementById('shopModal');
    const skinGrid = document.getElementById('skinGrid');
    const trailGrid = document.getElementById('trailGrid');

    function updateHUD() {
      document.getElementById('keyHud').textContent = `KEYS: ${totalKeys}`;
      document.getElementById('formHud').textContent = `FORM: ${p.form.toUpperCase()}`;
      document.getElementById('deathHud').textContent = `ATTEMPTS: ${attempts}`;
    }

    function toggleShop(forceState = null) {
      shopOpen = forceState !== null ? forceState : !shopOpen;
      shopModal.classList.toggle('open', shopOpen);
      if (shopOpen) renderShop();
    }

    document.getElementById('shopToggle').onclick = () => toggleShop(true);
    document.getElementById('closeShop').onclick = () => toggleShop(false);

    function drawMiniSkin(canvas, skinId) {
      const sctx = canvas.getContext('2d');
      sctx.clearRect(0, 0, 22, 22);
      renderSkinArt(sctx, 0, 0, 22, 22, skinId, '#00f0ff');
    }

    function renderShop() {
      skinGrid.innerHTML = '';
      SKINS.forEach(skin => {
        const owned = unlockedSkins.includes(skin.id);
        const eq = equippedSkin === skin.id;
        const card = document.createElement('div');
        card.className = `skin-card ${eq ? 'equipped' : ''}`;
        card.innerHTML = `
          <div class="skin-info">
            <div class="skin-name">${skin.name}</div>
            <div class="skin-cost ${owned ? 'owned' : ''}">
              ${eq ? 'EQUIPPED' : owned ? 'OWNED' : `${skin.cost} KEYS`}
            </div>
          </div>
          <canvas width="22" height="22"></canvas>
        `;
        drawMiniSkin(card.querySelector('canvas'), skin.id);
        card.onclick = () => {
          if (owned) {
            equippedSkin = skin.id;
            playTone(520, 'sine', 0.08);
          } else if (totalKeys >= skin.cost) {
            totalKeys -= skin.cost;
            unlockedSkins.push(skin.id);
            equippedSkin = skin.id;
            playTone(440, 'triangle', 0.1, 880);
          } else {
            playTone(150, 'sawtooth', 0.12, 100);
          }
          saveShopData();
          updateHUD();
          renderShop();
        };
        skinGrid.appendChild(card);
      });

      trailGrid.innerHTML = '';
      TRAILS.forEach(tr => {
        const owned = unlockedTrails.includes(tr.id);
        const eq = equippedTrail === tr.id;
        const card = document.createElement('div');
        card.className = `skin-card ${eq ? 'equipped' : ''}`;
        const bgStyle = tr.color === 'rainbow'
          ? 'background: linear-gradient(135deg, #ff007f, #ffea00, #00f0ff);'
          : `background: ${tr.color};`;
        card.innerHTML = `
          <div class="skin-info">
            <div class="skin-name">${tr.name}</div>
            <div class="skin-cost ${owned ? 'owned' : ''}">
              ${eq ? 'EQUIPPED' : owned ? 'OWNED' : `${tr.cost} KEYS`}
            </div>
          </div>
          <div class="trail-swatch" style="${bgStyle}"></div>
        `;
        card.onclick = () => {
          if (owned) {
            equippedTrail = tr.id;
            playTone(520, 'sine', 0.08);
          } else if (totalKeys >= tr.cost) {
            totalKeys -= tr.cost;
            unlockedTrails.push(tr.id);
            equippedTrail = tr.id;
            playTone(440, 'triangle', 0.1, 880);
          } else {
            playTone(150, 'sawtooth', 0.12, 100);
          }
          saveShopData();
          updateHUD();
          renderShop();
        };
        trailGrid.appendChild(card);
      });
    }

    function getTrailColor(offset = 0) {
      if (equippedTrail === 'rainbow') {
        return `hsl(${(tick * 6 + offset) % 360}, 95%, 60%)`;
      }
      const found = TRAILS.find(t => t.id === equippedTrail);
      return found ? found.color : '#00f0ff';
    }

    // --- INPUT LISTENERS ---
    window.addEventListener('keydown', (e) => {
      const code = e.code;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) {
        e.preventDefault();
      }
      if (code === 'KeyS') {
        toggleShop();
        return;
      }
      if (shopOpen) return;

      if ((code === 'KeyW' || code === 'ArrowUp' || code === 'Space') && !keys[code]) {
        jumpPressed = true;
        jumpHeld = true;
      }
      if ((code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyK') && !keys[code]) {
        dashPressed = true;
      }
      if (code === 'KeyR') {
        respawnPlayer(false);
      }
      keys[code] = true;
    });

    window.addEventListener('keyup', (e) => {
      const code = e.code;
      keys[code] = false;
      if (code === 'KeyW' || code === 'ArrowUp' || code === 'Space') {
        jumpHeld = false;
      }
    });

    // --- PARTICLE & COLLISION HELPERS ---
    function spawnParticles(x, y, color, count = 12, speed = 3.5) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = (0.3 + Math.random() * 0.7) * speed;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 18 + Math.random() * 14,
          maxLife: 32,
          color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // --- LEVEL GENERATOR (HAND-TUNED + PROCEDURAL GAUNTLET) ---
    function loadLevel(lvl) {
      platforms = [];
      crumblePlats = [];
      spikes = [];
      pads = [];
      orbs = [];
      portals = [];
      lasers = [];
      checkpoints = [];
      coins = [];
      particles = [];
      ghostTrail = [];
      bgProps = [];
      activeCheckpoint = null;
      bannerTimer = 110;

      const themes = [
        { bg: '#0c0c0e', plat: '#27272a', accent: '#00f0ff', spike: '#ef4444', mode: 'SECTOR 01 • CUBE & SHIP' },
        { bg: '#0d0914', plat: '#2e1f47', accent: '#ff007f', spike: '#ff3366', mode: 'SECTOR 02 • GRAVITY BALL' },
        { bg: '#07120e', plat: '#19382c', accent: '#00ff66', spike: '#ff5500', mode: 'SECTOR 03 • WAVE OVERDRIVE' }
      ];
      theme = themes[(lvl - 1) % themes.length];
      c.style.borderColor = theme.accent;

      for (let i = 0; i < 24; i++) {
        bgProps.push({
          x: i * 140,
          y: 30 + (i * 47) % 260,
          size: 24 + (i % 4) * 16,
          speed: 0.25 + (i % 3) * 0.1
        });
      }

      const levelLen = 1900 + (lvl - 1) * 350;
      bounds = { minX: 0, maxX: levelLen, minY: 0, maxY: 380 };

      // Starting Safe Floor & Ceiling
      platforms.push({ x: 0, y: 330, w: 320, h: 50 });
      platforms.push({ x: 0, y: 0, w: levelLen, h: 20 });

      spawn = { x: 40, y: 295 };

      // Section 1: Cube & Orb Jumps
      spikes.push({ x: 190, y: 312, w: 18, h: 18, dir: 1 });
      platforms.push({ x: 360, y: 290, w: 140, h: 90 });
      pads.push({ x: 465, y: 282, w: 26, h: 8, power: -11.5 });
      coins.push({ x: 530, y: 150, r: 9, collected: false });

      platforms.push({ x: 560, y: 230, w: 170, h: 150 });
      spikes.push({ x: 635, y: 212, w: 18, h: 18, dir: 1 });
      orbs.push({ x: 775, y: 205, r: 12, used: false });

      // Checkpoint 1 + Ship Portal
      platforms.push({ x: 830, y: 260, w: 220, h: 120 });
      checkpoints.push({ x: 860, y: 228, w: 16, h: 32, active: false });
      portals.push({ x: 960, y: 140, w: 24, h: 120, toForm: 'ship', color: '#ff007f' });

      // Section 2: Ship Flight Corridor
      platforms.push({ x: 1050, y: 340, w: 520, h: 40 });
      platforms.push({ x: 1120, y: 20, w: 70, h: 130 });
      spikes.push({ x: 1146, y: 150, w: 18, h: 18, dir: -1 });
      platforms.push({ x: 1260, y: 220, w: 70, h: 120 });
      spikes.push({ x: 1286, y: 202, w: 18, h: 18, dir: 1 });
      lasers.push({ x: 1410, y: 20, w: 10, h: 320, period: 110, offset: lvl * 15 });
      coins.push({ x: 1475, y: 180, r: 9, collected: false });

      // Checkpoint 2 + Ball / Wave Portal
      platforms.push({ x: 1570, y: 290, w: 240, h: 90 });
      checkpoints.push({ x: 1600, y: 258, w: 16, h: 32, active: false });
      const nextForm = lvl % 2 === 1 ? 'ball' : 'wave';
      portals.push({ x: 1700, y: 160, w: 24, h: 130, toForm: nextForm, color: '#00ff66' });

      // Section 3: Final Gauntlet to Goal
      let cursorX = 1810;
      while (cursorX < levelLen - 260) {
        const gap = 55 + ((cursorX + lvl * 31) % 45);
        const platW = 120 + ((cursorX * 7) % 80);
        const platY = 230 + ((cursorX * 13 + lvl * 29) % 85);

        if ((cursorX / 10) % 3 === 0) {
          crumblePlats.push({ x: cursorX + gap, y: platY, w: platW, h: 18, timer: 0, broken: false });
        } else {
          platforms.push({ x: cursorX + gap, y: platY, w: platW, h: 380 - platY });
          if (platW > 145) {
            spikes.push({ x: cursorX + gap + platW / 2 - 9, y: platY - 18, w: 18, h: 18, dir: 1 });
          }
        }
        cursorX += gap + platW;
      }

      // Goal Platform
      const endX = levelLen - 180;
      platforms.push({ x: endX, y: 280, w: 180, h: 100 });
      goal = { x: endX + 115, y: 236, w: 26, h: 44 };

      respawnPlayer(true);
    }

    function respawnPlayer(resetForm = false) {
      if (activeCheckpoint) {
        p.x = activeCheckpoint.x;
        p.y = activeCheckpoint.y;
        p.form = activeCheckpoint.form;
      } else {
        p.x = spawn.x;
        p.y = spawn.y;
        p.form = 'cube';
      }
      if (resetForm) p.form = 'cube';
      p.vx = 0;
      p.vy = 0;
      p.gravDir = 1;
      p.onGround = false;
      p.dashCharges = 1;
      p.dashTimer = 0;
      p.rot = 0;
      orbs.forEach(o => o.used = false);
      crumblePlats.forEach(cp => { cp.timer = 0; cp.broken = false; });
      updateHUD();
    }

    function killPlayer() {
      attempts++;
      shakeTimer = 14;
      playTone(140, 'sawtooth', 0.25, 45, 0.12);
      spawnParticles(p.x + p.w / 2, p.y + p.h / 2, theme.spike, 22, 4.5);
      respawnPlayer(false);
    }

    // --- PHYSICS & GAME LOOP ---
    function update() {
      if (shopOpen) return;
      tick++;
      if (shakeTimer > 0) shakeTimer--;
      if (bannerTimer > 0) bannerTimer--;

      // Horizontal Movement
      const moveLeft = keys['KeyA'] || keys['ArrowLeft'];
      const moveRight = keys['KeyD'] || keys['ArrowRight'];
      const targetSpeed = 4.4;

      if (p.dashTimer > 0) {
        p.dashTimer--;
        p.vx = p.facing * 9.5;
        p.vy = 0;
      } else {
        if (moveLeft) {
          p.vx = -targetSpeed;
          p.facing = -1;
        } else if (moveRight) {
          p.vx = targetSpeed;
          p.facing = 1;
        } else {
          p.vx *= 0.78;
          if (Math.abs(p.vx) < 0.1) p.vx = 0;
        }
      }

      // Air Dash
      if (dashPressed && p.dashCharges > 0 && p.dashTimer <= 0) {
        p.dashCharges--;
        p.dashTimer = 10;
        playTone(620, 'square', 0.11, 280, 0.08);
        spawnParticles(p.x + p.w / 2, p.y + p.h / 2, getTrailColor(), 10, 3);
      }

      // Jump Buffer & Coyote Time
      if (jumpPressed) p.jumpBuffer = 7;
      if (p.jumpBuffer > 0) p.jumpBuffer--;
      if (p.onGround) {
        p.coyote = 6;
        p.dashCharges = 1;
      } else if (p.coyote > 0) {
        p.coyote--;
      }

      // Orb Activation
      if (jumpPressed) {
        for (const orb of orbs) {
          if (!orb.used) {
            const dx = (p.x + p.w / 2) - orb.x;
            const dy = (p.y + p.h / 2) - orb.y;
            if (Math.hypot(dx, dy) < orb.r + 18) {
              orb.used = true;
              p.vy = -10.2 * p.gravDir;
              p.dashCharges = 1;
              p.jumpBuffer = 0;
              playTone(540, 'sine', 0.12, 880, 0.09);
              spawnParticles(orb.x, orb.y, '#ffea00', 12, 3);
              break;
            }
          }
        }
      }

      // Form-Specific Vertical Physics
      if (p.dashTimer <= 0) {
        if (p.form === 'cube') {
          p.vy += 0.56 * p.gravDir;
          if (p.jumpBuffer > 0 && p.coyote > 0) {
            p.vy = -10.0 * p.gravDir;
            p.onGround = false;
            p.coyote = 0;
            p.jumpBuffer = 0;
            playTone(320, 'square', 0.09, 540, 0.07);
          }
          if (!p.onGround) {
            p.rot += 0.14 * p.facing * p.gravDir;
          } else {
            p.rot = Math.round(p.rot / (Math.PI / 2)) * (Math.PI / 2);
          }
        } else if (p.form === 'ship') {
          p.vy += (jumpHeld ? -0.46 : 0.36) * p.gravDir;
          p.vy = Math.max(-6.2, Math.min(6.2, p.vy));
          p.rot = p.vy * 0.08;
          if (jumpHeld && tick % 4 === 0) {
            spawnParticles(p.x, p.y + p.h / 2, getTrailColor(), 2, 1.5);
          }
        } else if (p.form === 'ball') {
          p.vy += 0.54 * p.gravDir;
          if (p.jumpBuffer > 0 && p.coyote > 0) {
            p.gravDir *= -1;
            p.vy = 2.5 * p.gravDir;
            p.onGround = false;
            p.coyote = 0;
            p.jumpBuffer = 0;
            playTone(420, 'triangle', 0.1, 240, 0.08);
          }
          p.rot += 0.18 * p.facing * p.gravDir;
        } else if (p.form === 'wave') {
          const waveDir = jumpHeld ? -1 : 1;
          p.vy = 4.6 * waveDir * p.gravDir;
          p.rot = (p.vy > 0 ? 0.65 : -0.65) * p.facing;
        }
      }

      // Update Crumbling Platforms
      for (const cp of crumblePlats) {
        if (cp.broken) {
          cp.timer++;
          if (cp.timer > 140) { cp.broken = false; cp.timer = 0; }
        } else if (cp.timer > 0) {
          cp.timer++;
          if (cp.timer > 28) {
            cp.broken = true;
            spawnParticles(cp.x + cp.w / 2, cp.y + cp.h / 2, '#a1a1aa', 10, 2.5);
          }
        }
      }

      // Combine Active Solid Surfaces
      const solids = [...platforms, ...crumblePlats.filter(cp => !cp.broken)];

      // Move X & Resolve Horizontal Collisions
      p.x += p.vx;
      if (p.x < bounds.minX) p.x = bounds.minX;
      if (p.x + p.w > bounds.maxX) p.x = bounds.maxX - p.w;

      for (const s of solids) {
        if (rectsOverlap(p, s)) {
          if (p.vx > 0) p.x = s.x - p.w;
          else if (p.vx < 0) p.x = s.x + s.w;
          p.vx = 0;
        }
      }

      // Move Y & Resolve Vertical Collisions
      p.y += p.vy;
      p.onGround = false;

      for (const s of solids) {
        if (rectsOverlap(p, s)) {
          if (p.vy > 0) {
            p.y = s.y - p.h;
            if (p.gravDir === 1) p.onGround = true;
            if (s.timer !== undefined && s.timer === 0) s.timer = 1;
          } else if (p.vy < 0) {
            p.y = s.y + s.h;
            if (p.gravDir === -1) p.onGround = true;
          }
          p.vy = 0;
        }
      }

      // Pit Death
      if (p.y > bounds.maxY + 20 || p.y < -40) {
        killPlayer();
        jumpPressed = false;
        dashPressed = false;
        return;
      }

      // Jump Pads
      for (const pad of pads) {
        if (rectsOverlap(p, pad)) {
          p.vy = pad.power * p.gravDir;
          p.onGround = false;
          p.dashCharges = 1;
          playTone(460, 'sine', 0.14, 920, 0.09);
          spawnParticles(pad.x + pad.w / 2, pad.y, '#ffea00', 10, 3);
        }
      }

      // Mode Portals
      for (const portal of portals) {
        if (rectsOverlap(p, portal) && p.form !== portal.toForm) {
          p.form = portal.toForm;
          p.gravDir = 1;
          p.dashCharges = 1;
          updateHUD();
          playTone(350, 'triangle', 0.18, 760, 0.1);
          spawnParticles(p.x + p.w / 2, p.y + p.h / 2, portal.color, 18, 4);
        }
      }

      // Checkpoints
      for (const cp of checkpoints) {
        if (!cp.active && rectsOverlap(p, cp)) {
          cp.active = true;
          activeCheckpoint = { x: cp.x, y: cp.y, form: p.form };
          playTone(580, 'sine', 0.12, 860, 0.08);
          spawnParticles(cp.x + cp.w / 2, cp.y + cp.h / 2, '#00ff66', 14, 3);
        }
      }

      // Secret Coins (+2 Keys)
      for (const coin of coins) {
        if (!coin.collected) {
          const dx = (p.x + p.w / 2) - coin.x;
          const dy = (p.y + p.h / 2) - coin.y;
          if (Math.hypot(dx, dy) < coin.r + 14) {
            coin.collected = true;
            totalKeys += 2;
            saveShopData();
            updateHUD();
            playTone(740, 'sine', 0.14, 1180, 0.1);
            spawnParticles(coin.x, coin.y, '#ffea00', 16, 3.5);
          }
        }
      }

      // Spikes Hazard Check (Forgiving Inner Hitbox)
      const hurtBox = { x: p.x + 4, y: p.y + 4, w: p.w - 8, h: p.h - 8 };
      for (const sp of spikes) {
        if (rectsOverlap(hurtBox, sp)) {
          killPlayer();
          jumpPressed = false;
          dashPressed = false;
          return;
        }
      }

      // Pulsing Lasers Hazard Check
      for (const lz of lasers) {
        const cycle = (tick + lz.offset) % lz.period;
        const isActive = cycle < lz.period * 0.45;
        if (isActive && rectsOverlap(hurtBox, lz)) {
          killPlayer();
          jumpPressed = false;
          dashPressed = false;
          return;
        }
      }

      // Goal Check (+5 Keys & Next Level)
      if (rectsOverlap(p, goal)) {
        totalKeys += 5;
        level++;
        saveShopData();
        updateHUD();
        playTone(440, 'triangle', 0.1, 660, 0.1);
        setTimeout(() => playTone(660, 'triangle', 0.18, 990, 0.1), 100);
        loadLevel(level);
        jumpPressed = false;
        dashPressed = false;
        return;
      }

      // Trail & Particles Update
      if (Math.abs(p.vx) > 0.5 || Math.abs(p.vy) > 0.5 || p.form === 'wave') {
        ghostTrail.push({
          x: p.x, y: p.y, w: p.w, h: p.h,
          rot: p.rot,
          alpha: 0.55,
          color: getTrailColor(ghostTrail.length * 14)
        });
        if (ghostTrail.length > 18) ghostTrail.shift();
      }

      for (let i = ghostTrail.length - 1; i >= 0; i--) {
        ghostTrail[i].alpha -= 0.032;
        if (ghostTrail[i].alpha <= 0) ghostTrail.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      // Smooth Camera Follow
      const targetCamX = p.x - c.width * 0.34;
      cam.x += (targetCamX - cam.x) * 0.14;
      cam.x = Math.max(0, Math.min(bounds.maxX - c.width, cam.x));

      jumpPressed = false;
      dashPressed = false;
    }

    // --- RENDERING ---
    function renderSkinArt(context, x, y, w, h, skinId, accentColor) {
      context.fillStyle = '#141418';
      context.fillRect(x, y, w, h);
      context.strokeStyle = accentColor;
      context.lineWidth = 2;
      context.strokeRect(x + 1, y + 1, w - 2, h - 2);

      if (skinId === 'gdface') {
        context.fillStyle = accentColor;
        context.fillRect(x + 5, y + 6, 4, 4);
        context.fillRect(x + 13, y + 6, 4, 4);
        context.fillRect(x + 5, y + 14, 12, 3);
      } else if (skinId === 'ninja') {
        context.fillStyle = '#ff007f';
        context.fillRect(x + 2, y + 6, w - 4, 5);
        context.fillStyle = '#ffffff';
        context.fillRect(x + 5, y + 7, 4, 3);
        context.fillRect(x + 13, y + 7, 4, 3);
      } else if (skinId === 'visor') {
        context.fillStyle = '#00f0ff';
        context.fillRect(x + 3, y + 6, w - 6, 6);
        context.fillStyle = '#ffffff';
        context.fillRect(x + 5, y + 7, 6, 2);
      } else if (skinId === 'demon') {
        context.fillStyle = '#ef4444';
        context.fillRect(x + 4, y + 5, 5, 5);
        context.fillRect(x + 13, y + 5, 5, 5);
        context.fillRect(x + 6, y + 14, 10, 4);
      } else if (skinId === 'reactor') {
        context.strokeStyle = '#ffea00';
        context.lineWidth = 1.5;
        context.strokeRect(x + 5, y + 5, w - 10, h - 10);
        context.fillStyle = '#00f0ff';
        context.fillRect(x + 9, y + 9, 4, 4);
      }
    }

    function drawPlayer() {
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      const accent = getTrailColor();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(p.rot);

      if (p.form === 'cube') {
        renderSkinArt(ctx, -p.w / 2, -p.h / 2, p.w, p.h, equippedSkin, accent);
      } else if (p.form === 'ship') {
        ctx.fillStyle = '#18181f';
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-12, -8);
        ctx.lineTo(13, 0);
        ctx.lineTo(-12, 8);
        ctx.lineTo(-7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (p.form === 'ball') {
        ctx.fillStyle = '#18181f';
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-p.w / 2, 0);
        ctx.lineTo(p.w / 2, 0);
        ctx.moveTo(0, -p.h / 2);
        ctx.lineTo(0, p.h / 2);
        ctx.stroke();
      } else if (p.form === 'wave') {
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.moveTo(-10, -7);
        ctx.lineTo(12, 0);
        ctx.lineTo(-10, 7);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.save();
      if (shakeTimer > 0) {
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
      }

      // Parallax Background Grid & Geometric Shapes
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridStep = 40;
      const offsetX = -(cam.x * 0.4) % gridStep;
      for (let gx = offsetX; gx < c.width; gx += gridStep) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, c.height);
        ctx.stroke();
      }

      for (const prop of bgProps) {
        const px = ((prop.x - cam.x * prop.speed) % (c.width + 200) + (c.width + 200)) % (c.width + 200) - 100;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.strokeRect(px, prop.y, prop.size, prop.size);
      }

      ctx.translate(-cam.x, -cam.y);

      // Ghost Motion Trail
      for (const g of ghostTrail) {
        ctx.save();
        ctx.globalAlpha = g.alpha * 0.5;
        ctx.translate(g.x + g.w / 2, g.y + g.h / 2);
        ctx.rotate(g.rot);
        ctx.fillStyle = g.color;
        ctx.fillRect(-g.w / 2, -g.h / 2, g.w, g.h);
        ctx.restore();
      }

      // Solid Platforms
      for (const s of platforms) {
        ctx.fillStyle = theme.plat;
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(s.x, s.y, s.w, s.h);
      }

      // Crumbling Platforms
      for (const cp of crumblePlats) {
        if (cp.broken) continue;
        ctx.fillStyle = cp.timer > 0 ? '#52525b' : '#3f3f46';
        ctx.fillRect(cp.x, cp.y, cp.w, cp.h);
        ctx.strokeStyle = '#a1a1aa';
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(cp.x, cp.y, cp.w, cp.h);
        ctx.setLineDash([]);
      }

      // Jump Pads
      for (const pad of pads) {
        ctx.fillStyle = '#ffea00';
        ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
      }

      // Jump Orbs
      for (const orb of orbs) {
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fillStyle = orb.used ? 'rgba(255, 234, 0, 0.2)' : 'rgba(255, 234, 0, 0.85)';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Mode Portals
      for (const portal of portals) {
        ctx.fillStyle = portal.color + '33';
        ctx.fillRect(portal.x, portal.y, portal.w, portal.h);
        ctx.strokeStyle = portal.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(portal.x, portal.y, portal.w, portal.h);
      }

      // Checkpoints
      for (const cp of checkpoints) {
        ctx.fillStyle = cp.active ? '#00ff66' : '#52525b';
        ctx.fillRect(cp.x, cp.y, 4, cp.h);
        ctx.beginPath();
        ctx.moveTo(cp.x + 4, cp.y);
        ctx.lineTo(cp.x + 18, cp.y + 7);
        ctx.lineTo(cp.x + 4, cp.y + 14);
        ctx.closePath();
        ctx.fill();
      }

      // Secret Coins
      for (const coin of coins) {
        if (coin.collected) continue;
        const pulse = Math.sin(tick * 0.12) * 2;
        ctx.beginPath();
        ctx.arc(coin.x, coin.y + pulse, coin.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffea00';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Spikes
      for (const sp of spikes) {
        ctx.fillStyle = theme.spike;
        ctx.beginPath();
        if (sp.dir === 1) {
          ctx.moveTo(sp.x, sp.y + sp.h);
          ctx.lineTo(sp.x + sp.w / 2, sp.y);
          ctx.lineTo(sp.x + sp.w, sp.y + sp.h);
        } else {
          ctx.moveTo(sp.x, sp.y);
          ctx.lineTo(sp.x + sp.w / 2, sp.y + sp.h);
          ctx.lineTo(sp.x + sp.w, sp.y);
        }
        ctx.closePath();
        ctx.fill();
      }

      // Lasers
      for (const lz of lasers) {
        const cycle = (tick + lz.offset) % lz.period;
        const isActive = cycle < lz.period * 0.45;
        const isWarning = !isActive && cycle > lz.period * 0.82;
        if (isActive) {
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(lz.x, lz.y, lz.w, lz.h);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(lz.x + 3, lz.y, lz.w - 6, lz.h);
        } else if (isWarning) {
          ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
          ctx.fillRect(lz.x + 3, lz.y, lz.w - 6, lz.h);
        }
      }

      // Goal Gate
      ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
      ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

      // Player
      drawPlayer();

      // Particles
      for (const pt of particles) {
        ctx.globalAlpha = pt.life / pt.maxLife;
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
      }
      ctx.globalAlpha = 1;

      ctx.restore();

      // Progress Bar & Sector Banner
      const progress = Math.min(1, Math.max(0, p.x / (goal.x || 1)));
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(180, 12, 320, 5);
      ctx.fillStyle = theme.accent;
      ctx.fillRect(180, 12, 320 * progress, 5);

      if (bannerTimer > 0) {
        ctx.globalAlpha = Math.min(1, bannerTimer / 25);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 13px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`LEVEL ${level} • ${theme.mode}`, c.width / 2, 42);
        ctx.globalAlpha = 1;
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Boot Game
    updateHUD();
    loadLevel(level);
    loop();
  </script>
</body>
</html>
